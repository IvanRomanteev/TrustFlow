[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustflow"
version = "0.1.0"
description = "Self-verifying multi-agent workflow system (synthetic financial data only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trustflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["trustflow"]
strict = false
warn_return_any = true
ignore_missing_imports = true
