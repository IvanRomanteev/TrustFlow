<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980" role="img" aria-labelledby="title description">
<title id="title">TrustFlow architecture and evidence boundary</title>
<desc id="description">Planner uses a Muse LLM Provider boundary with accepted fake output and pending live Meta evidence. Deterministic PolicyEngine gates Human Approval, Executor writes the SQLite Ledger, Verifier reads it independently. Recovery is verification only. Observability records audit hashes, workflow usage and evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547084"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173147}.h{font-size:24px;font-weight:700}.s{font-size:18px}.l{font-size:16px;fill:#425d72}.box{fill:#fff;stroke:#c6d6df;stroke-width:2}.edge{fill:none;stroke:#547084;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
